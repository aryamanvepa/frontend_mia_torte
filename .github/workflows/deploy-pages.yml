# Builds the storefront on every push to main, nightly and on demand, and publishes it twice:
#   1. Cloudflare Pages  → https://lamiatorte.com, the shop's main address (BASE_PATH=/)
#   2. GitHub Pages      → https://aryamanvepa.github.io/frontend_mia_torte/ (BASE_PATH=/<repo>/)
# Both builds use VITE_SITE_URL=https://lamiatorte.com, so canonicals, structured data and the
# sitemap point at the main domain and the github.io copy doesn't compete in search.
# The two jobs are independent: a Cloudflare failure never blocks the GitHub Pages deploy.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   VITE_SUPABASE_URL              https://<project-ref>.supabase.co
#   VITE_SUPABASE_PUBLISHABLE_KEY  the publishable (anon) key. Never the service_role key.
#   VITE_SITE_URL                  optional: defaults to https://lamiatorte.com
#   VITE_HIDE_TEST_DATA            1 hides made-up label data and stock product photos
#   CLOUDFLARE_ACCOUNT_ID          the Cloudflare account that owns the Pages project
# Repository secret:
#   CLOUDFLARE_API_TOKEN           Cloudflare API token with Pages: Edit on that account
#
# The build pre-renders every page with the live catalogue (scripts/prerender.mjs, using the
# runner's Chrome), so it also runs nightly to keep prices and stock in the saved pages fresh.
name: Deploy shop (Cloudflare Pages + GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST every night: refresh pre-rendered pages and sitemap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://lamiatorte.com' }}
  # Launch switch: 1 hides made-up label data and stock product photos (src/content/test-labels.ts).
  VITE_HIDE_TEST_DATA: ${{ vars.VITE_HIDE_TEST_DATA }}
  CHROME_PATH: /usr/bin/google-chrome

jobs:
  # ------------------------------------------------------------------ Cloudflare Pages (lamiatorte.com)
  cloudflare:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Launch checks (titles, canonicals, structured data, sitemap; no placeholders or test data)
        run: npm run check
      - name: Create the Pages project (fails harmlessly if it already exists)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create lamiatorte --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lamiatorte --branch=main

  # ------------------------------------------------------------------ GitHub Pages (github.io copy)
  github-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Serve under /<repo>/ (works for push, nightly and manual runs alike)
        run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Launch checks (titles, canonicals, structured data, sitemap; no placeholders or test data)
        run: npm run check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: github-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
